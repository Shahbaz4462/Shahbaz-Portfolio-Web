  <rect x="445" y="452" width="310" height="140" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <rect x="463" y="470" width="64" height="64" rx="10" fill="rgba(251,113,133,0.15)" />
  <rect x="479" y="486" width="32" height="32" rx="6" fill="#FDA4AF" stroke="#E11D48" stroke-width="2" />
  <text x="543" y="496" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F1F5F9">Fresh Cakes</text>
  <text x="543" y="520" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Birthday &amp; custom orders</text>
  <text x="463" y="570" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Categories · Gallery · Team</text>

  <rect x="790" y="452" width="310" height="140" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <rect x="808" y="470" width="64" height="64" rx="10" fill="rgba(52,211,153,0.13)" />
  <path d="M824 518 L840 488 L856 518 Z" fill="#6EE7B7" stroke="#059669" stroke-width="2" />
  <text x="888" y="496" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#F1F5F9">Bakers' Special</text>
  <text x="888" y="520" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Biscuits, rusks &amp; more</text>
  <text x="808" y="570" font-family="Arial, sans-serif" font-size="13" fill="#94A3B8">Inquiries land in the panel</text>
