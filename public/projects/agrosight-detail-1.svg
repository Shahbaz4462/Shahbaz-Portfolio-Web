<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <circle cx="250" cy="160" r="240" fill="#10B981" opacity="0.13" filter="blur(60px)" />
  <circle cx="980" cy="520" r="240" fill="#C8F135" opacity="0.07" filter="blur(60px)" />

  <!-- Phone frame -->
  <rect x="120" y="60" width="330" height="555" rx="36" fill="rgba(15,23,42,0.95)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  <rect x="245" y="82" width="80" height="10" rx="5" fill="rgba(255,255,255,0.15)" />
  <text x="150" y="140" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#F8FAFC">Disease Severity</text>
  <rect x="150" y="165" width="270" height="180" rx="12" fill="rgba(6,78,59,0.4)" stroke="rgba(52,211,153,0.3)" />
  <path d="M285 325 C235 295 228 235 248 190 C290 208 330 192 342 182 C348 238 342 300 285 325 Z" fill="#14532D" stroke="#34D399" stroke-width="2" />
  <circle cx="272" cy="252" r="13" fill="#EF4444" opacity="0.65" />
  <circle cx="305" cy="222" r="9" fill="#EF4444" opacity="0.55" />
  <circle cx="262" cy="288" r="7" fill="#EF4444" opacity="0.5" />
  <text x="150" y="385" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Damaged area</text>
  <text x="420" y="385" text-anchor="end" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#FBBF24">12% · Moderate</text>
  <rect x="150" y="400" width="270" height="12" rx="6" fill="rgba(255,255,255,0.1)" />
  <rect x="150" y="400" width="120" height="12" rx="6" fill="#F59E0B" />
  <rect x="150" y="440" width="270" height="52" rx="10" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.35)" />
  <text x="168" y="472" font-family="Arial, sans-serif" font-size="14" fill="#A7F3D0">Compared with your last scan:</text>
  <text x="168" y="540" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Spread is slowing — keep the</text>
  <text x="168" y="562" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">same treatment for 7 more days.</text>

  <!-- Side panel: the cascade -->
  <text x="540" y="130" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#34D399">HOW IT WORKS</text>
  <text x="540" y="172" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#F8FAFC">Gatekeeper-and-specialist</text>
  <text x="540" y="206" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#F8FAFC">deep-learning cascade</text>

  <rect x="540" y="250" width="560" height="86" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="586" cy="293" r="20" fill="url(#greenGrad)" />
  <text x="586" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#052E22">1</text>
  <text x="626" y="286" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">Leaf gate</text>
  <text x="626" y="312" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Is there a leaf in this photo at all?</text>

  <rect x="540" y="356" width="560" height="86" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="586" cy="399" r="20" fill="url(#greenGrad)" />
  <text x="586" y="406" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#052E22">2</text>
  <text x="626" y="392" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">Crop identification</text>
  <text x="626" y="418" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">Cotton, wheat or rice — 97.3% on the held-out test.</text>

  <rect x="540" y="462" width="560" height="86" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <circle cx="586" cy="505" r="20" fill="url(#greenGrad)" />
  <text x="586" y="512" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#052E22">3</text>
  <text x="626" y="498" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#F1F5F9">Disease specialist</text>
  <text x="626" y="524" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">One model per crop — 19 classes, honest “Not sure”.</text>

  <text x="540" y="596" font-family="Arial, sans-serif" font-size="14" fill="#64748B">Runs fully in the browser with TensorFlow.js — no server, no cost per scan.</text>
</svg>
