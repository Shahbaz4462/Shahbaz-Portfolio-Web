<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <circle cx="1020" cy="150" r="240" fill="#10B981" opacity="0.13" filter="blur(60px)" />
  <circle cx="160" cy="540" r="230" fill="#06B6D4" opacity="0.08" filter="blur(60px)" />

  <rect x="60" y="40" width="1080" height="595" rx="16" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <rect x="60" y="40" width="1080" height="60" fill="rgba(30, 41, 59, 0.7)" />
  <circle cx="95" cy="70" r="6" fill="#F87171" />
  <circle cx="120" cy="70" r="6" fill="#FBBF24" />
  <circle cx="145" cy="70" r="6" fill="#34D399" />
  <text x="190" y="76" font-family="Arial, sans-serif" font-size="15" fill="#94A3B8">Disease Map · Pakistan — Asia — World</text>

  <!-- Stylised map panel -->
  <rect x="100" y="130" width="620" height="380" rx="14" fill="rgba(6,78,59,0.3)" stroke="rgba(52,211,153,0.3)" />
  <path d="M240 200 L330 160 L430 185 L520 150 L610 200 L640 300 L590 420 L470 470 L330 450 L225 380 L205 280 Z" fill="rgba(16,185,129,0.18)" stroke="#34D399" stroke-width="2" />
  <circle cx="330" cy="290" r="10" fill="#F59E0B" />
  <circle cx="470" cy="240" r="8" fill="#EF4444" opacity="0.85" />
  <circle cx="520" cy="350" r="9" fill="#F59E0B" />
  <circle cx="400" cy="390" r="7" fill="#34D399" />
  <rect x="120" y="452" width="180" height="38" rx="8" fill="rgba(15,23,42,0.85)" stroke="rgba(255,255,255,0.15)" />
  <text x="210" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#CBD5E1">Wheat stripe rust · Punjab</text>

  <!-- Stats panels -->
  <rect x="752" y="130" width="348" height="180" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <text x="780" y="168" font-family="Arial, sans-serif" font-size="13" letter-spacing="2" fill="#34D399">DISEASE TYPES · PAKISTAN</text>
  <text x="780" y="204" font-family="Arial, sans-serif" font-size="14" fill="#CBD5E1">Fungal</text>
  <rect x="780" y="216" width="292" height="9" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="780" y="216" width="254" height="9" rx="4" fill="url(#greenGrad)" />
  <text x="780" y="252" font-family="Arial, sans-serif" font-size="14" fill="#CBD5E1">Bacterial</text>
  <rect x="780" y="264" width="292" height="9" rx="4" fill="rgba(255,255,255,0.1)" />
  <rect x="780" y="264" width="26" height="9" rx="4" fill="#38BDF8" />
  <text x="1072" y="204" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">87%</text>
  <text x="1072" y="252" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#94A3B8">9%</text>

  <rect x="752" y="330" width="348" height="180" rx="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <text x="780" y="368" font-family="Arial, sans-serif" font-size="13" letter-spacing="2" fill="#34D399">EVERY FIGURE SOURCED</text>
  <text x="780" y="404" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">Each disease on the map carries</text>
  <text x="780" y="428" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">a public reference — PlantWise,</text>
  <text x="780" y="452" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">FAO, APS and university sources.</text>
  <text x="780" y="486" font-family="Arial, sans-serif" font-size="13" fill="#64748B">No source, no statistic — the rule across the site.</text>

  <!-- Bottom strip: languages + alerts -->
  <rect x="100" y="540" width="310" height="60" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <text x="255" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">4 languages + voice-only mode</text>
  <rect x="445" y="540" width="310" height="60" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <text x="600" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">Daily 6 AM weather alerts</text>
  <rect x="790" y="540" width="310" height="60" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" />
  <text x="945" y="577" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#E2E8F0">Free for every farmer</text>
</svg>
