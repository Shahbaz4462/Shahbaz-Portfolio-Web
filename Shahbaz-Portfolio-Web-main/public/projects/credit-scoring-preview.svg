<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chartBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)" />
  <circle cx="200" cy="150" r="250" fill="#2563EB" opacity="0.12" filter="blur(60px)" />
  <circle cx="1000" cy="500" r="250" fill="#06B6D4" opacity="0.12" filter="blur(60px)" />

  <rect x="60" y="40" width="1080" height="595" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Navbar -->
  <rect x="60" y="40" width="1080" height="56" fill="rgba(30, 41, 59, 0.6)" />
  <circle cx="95" cy="68" r="6" fill="#EF4444" />
  <circle cx="115" cy="68" r="6" fill="#F59E0B" />
  <circle cx="135" cy="68" r="6" fill="#10B981" />
  <text x="180" y="73" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16">ML Credit Scoring &amp; Risk Analytics Dashboard</text>

  <!-- Left Column: Input Form & Applicant Info -->
  <rect x="80" y="116" width="340" height="495" rx="12" fill="rgba(30, 41, 59, 0.4)" stroke="rgba(255,255,255,0.05)" />
  <text x="100" y="150" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Applicant Assessment</text>

  <text x="100" y="190" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Annual Income ($)</text>
  <rect x="100" y="200" width="300" height="36" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.1)" />
  <text x="115" y="223" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14">$85,000</text>

  <text x="100" y="260" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Debt-to-Income Ratio (%)</text>
  <rect x="100" y="270" width="300" height="36" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.1)" />
  <text x="115" y="293" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14">18.5%</text>

  <text x="100" y="330" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Credit History Length (Years)</text>
  <rect x="100" y="340" width="300" height="36" rx="6" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.1)" />
  <text x="115" y="363" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14">7.5 Years</text>

  <rect x="100" y="410" width="300" height="45" rx="8" fill="url(#cyanAccent)" />
  <text x="250" y="438" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Calculate Score (ML Predict)</text>

  <!-- Right Column: Score Gauge & Analytics Charts -->
  <rect x="440" y="116" width="680" height="495" rx="12" fill="rgba(30, 41, 59, 0.3)" stroke="rgba(255,255,255,0.05)" />

  <!-- Score Gauge Arc Card -->
  <g transform="translate(460, 140)">
    <rect x="0" y="0" width="320" height="200" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)" />
    <text x="20" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Predicted Credit Score</text>
    
    <path d="M 60 150 A 70 70 0 0 1 260 150" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="14" stroke-linecap="round" />
    <path d="M 60 150 A 70 70 0 0 1 230 90" fill="none" stroke="url(#cyanAccent)" stroke-width="14" stroke-linecap="round" />

    <text x="160" y="130" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="800" font-size="36" text-anchor="middle">785</text>
    <text x="160" y="155" fill="#10B981" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Low Risk • Approved</text>
  </g>

  <!-- Feature Importance Card -->
  <g transform="translate(800, 140)">
    <rect x="0" y="0" width="300" height="200" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)" />
    <text x="20" y="30" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="13">Top Feature Weights</text>

    <text x="20" y="65" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12">Payment History (38%)</text>
    <rect x="20" y="75" width="260" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="20" y="75" width="210" height="6" rx="3" fill="#2563EB" />

    <text x="20" y="110" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12">Credit Utilization (28%)</text>
    <rect x="20" y="120" width="260" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="20" y="120" width="160" height="6" rx="3" fill="#06B6D4" />

    <text x="20" y="155" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="12">Debt Ratio (18%)</text>
    <rect x="20" y="165" width="260" height="6" rx="3" fill="rgba(255,255,255,0.1)" />
    <rect x="20" y="165" width="100" height="6" rx="3" fill="#10B981" />
  </g>

  <!-- Chart Curve Area -->
  <rect x="460" y="360" width="640" height="230" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255,255,255,0.08)" />
  <text x="480" y="390" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="600" font-size="14">Risk Probability Curve</text>
  
  <path d="M 480 540 Q 600 440, 750 490 T 1070 420 L 1070 550 L 480 550 Z" fill="url(#chartBlue)" />
  <path d="M 480 540 Q 600 440, 750 490 T 1070 420" fill="none" stroke="#2563EB" stroke-width="3" />
</svg>
